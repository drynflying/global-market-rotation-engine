name: 10-Year Market Data Backfill

on:
  workflow_dispatch:
    inputs:
      backtest_years:
        description: "Years reserved for the actual backtest"
        required: true
        default: "10"
      warmup_years:
        description: "Extra calendar years downloaded before the backtest for indicator warm-up"
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: market-rotation-10y-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      BACKFILL_YEARS: ${{ inputs.backtest_years }}
      BACKFILL_WARMUP_YEARS: ${{ inputs.warmup_years }}
      BACKFILL_BATCH_SIZE: "10"
      BACKFILL_SECOND_PASS_BATCH_SIZE: "5"
      BACKFILL_INDIVIDUAL_ATTEMPTS: "3"
      BACKFILL_SEGMENT_YEARS: "3"
      BACKFILL_RETRY_BASE_SECONDS: "1"
      BACKFILL_STAGE_PAUSE_SECONDS: "5"
      BACKFILL_MIN_BARS: "260"
      BACKFILL_MIN_COVERAGE_RATIO: "0.85"
      BACKFILL_MAX_GAP_DAYS: "21"
      BACKFILL_MAX_STALE_DAYS: "7"
      BACKFILL_ALLOWED_MISSING: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Clean-Sheet R1/R1.1 unit tests
        run: python -m unittest discover -s research/clean_sheet_predictive/tests -v

      - name: Download reliable historical OHLCV
        run: python -m src.backfill_10y

      - name: Show backfill summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("backtest_data/backfill_summary.json")
          if not p.exists():
              print("Backfill summary was not produced.")
              raise SystemExit(0)

          summary = json.loads(p.read_text())
          print(json.dumps({
              "requested_start_date": summary["requested_start_date"],
              "overall_earliest_date": summary["overall_earliest_date"],
              "overall_latest_date": summary["overall_latest_date"],
              "configured_symbols": summary["configured_symbols"],
              "symbols_with_data": summary["symbols_with_data"],
              "failed_symbols": summary["failed_symbols"],
              "failed_symbol_list": summary["failed_symbol_list"],
              "completeness_ratio": summary["completeness_ratio"],
              "universe_completeness_status": summary["universe_completeness_status"],
              "recovered_after_first_bulk_pass_count": summary["recovered_after_first_bulk_pass_count"],
              "total_rows": summary["total_rows"],
          }, indent=2))
          PY

      - name: Build Clean-Sheet R1 point-in-time dataset
        run: |
          python -m research.clean_sheet_predictive.build_research_dataset \
            --input backtest_data/ohlcv_10y.csv \
            --config backtest_data/rotation_universe_snapshot.csv \
            --output research/clean_sheet_predictive/outputs \
            --analysis-years "${{ inputs.backtest_years }}"

      - name: Show Clean-Sheet R1 validation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("research/clean_sheet_predictive/outputs")
          manifest = json.loads((root / "dataset_manifest.json").read_text())
          validation = json.loads((root / "validation_report.json").read_text())
          print(json.dumps({
              "dataset_version": manifest["dataset_version"],
              "dataset_rows": manifest["dataset_rows"],
              "dataset_tickers": manifest["dataset_tickers"],
              "analysis_start_date": manifest["analysis_start_date"],
              "analysis_latest_date": manifest["analysis_latest_date"],
              "feature_count": manifest["feature_count"],
              "validation_status": validation["status"],
              "universe_completeness": validation["universe_completeness"],
              "future_mutation_test": validation["future_mutation_leakage_test"],
              "outcome_alignment": validation["outcome_alignment"],
          }, indent=2))
          PY

      - name: Upload Clean-Sheet R1 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-sheet-r1-${{ github.run_id }}
          path: research/clean_sheet_predictive/outputs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload 10-year OHLCV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-rotation-10y-ohlcv-${{ github.run_id }}
          path: backtest_data/
          if-no-files-found: warn
          retention-days: 30
