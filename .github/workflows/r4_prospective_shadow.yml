name: R4 Prospective Clean-Sheet Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: r4-prospective-shadow
  cancel-in-progress: false

jobs:
  r4:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out research branch
        uses: actions/checkout@v5
        with:
          ref: research/clean-sheet-predictive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install frozen research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run R4 unit tests
        run: |
          python -m unittest \
            research.clean_sheet_predictive.tests.test_r4 \
            research.clean_sheet_predictive.tests.test_r4_model_builder -v

      - name: Run prospective R4 shadow
        run: python -m research.clean_sheet_predictive.r4_prospective

      - name: Upload R4 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-sheet-r4-prospective-${{ github.run_id }}
          path: results/clean_sheet_r4/
          if-no-files-found: error
          retention-days: 30

      - name: Commit R4 research state to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv_history.csv results/clean_sheet_r4/
          if git diff --cached --quiet; then
            echo "No R4 research-state changes to commit."
          else
            git commit -m "Update R4 prospective shadow"
            git push origin HEAD:research/clean-sheet-predictive
          fi
