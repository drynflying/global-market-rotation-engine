name: R4 Annual Frozen Model Refresh

on:
  workflow_dispatch:
    inputs:
      model_year:
        description: "Calendar model year to append; blank uses current year"
        required: false
        default: ""
  schedule:
    - cron: "45 18 3 1 *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: r4-annual-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out research branch
        uses: actions/checkout@v5
        with:
          ref: research/clean-sheet-predictive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install frozen research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve model year and backfill span
        env:
          INPUT_MODEL_YEAR: ${{ inputs.model_year }}
        run: |
          if [ -n "$INPUT_MODEL_YEAR" ]; then
            MODEL_YEAR="$INPUT_MODEL_YEAR"
          else
            MODEL_YEAR="$(date +%Y)"
          fi
          BACKTEST_YEARS=$((MODEL_YEAR - 2016))
          if [ "$BACKTEST_YEARS" -lt 10 ]; then
            BACKTEST_YEARS=10
          fi
          echo "MODEL_YEAR=$MODEL_YEAR" >> "$GITHUB_ENV"
          echo "BACKFILL_YEARS=$BACKTEST_YEARS" >> "$GITHUB_ENV"
          echo "BACKFILL_WARMUP_YEARS=1" >> "$GITHUB_ENV"

      - name: Temporarily freeze config to R4 inception universe
        run: |
          cp config/rotation_universe.csv /tmp/rotation_universe_original.csv
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          registry = json.loads(
              Path("research/clean_sheet_predictive/r4_model_registry.json").read_text()
          )
          frozen = set(registry["frozen_universe_tickers"])
          path = Path("config/rotation_universe.csv")
          cfg = pd.read_csv(path, dtype=str, keep_default_na=False)
          cfg["ticker"] = cfg["ticker"].str.upper().str.strip()
          missing = sorted(frozen - set(cfg["ticker"]))
          if missing:
              raise RuntimeError(
                  "Current config is missing frozen R4 tickers: " + ", ".join(missing)
              )
          cfg = cfg[cfg["ticker"].isin(frozen)].copy()
          cfg["enabled"] = "True"
          cfg["query_ohlcv"] = "True"
          cfg.to_csv(path, index=False)
          print(f"Frozen annual model-build universe: {len(cfg)} rows")
          PY

      - name: Download frozen-universe history
        env:
          BACKFILL_BATCH_SIZE: "10"
          BACKFILL_SECOND_PASS_BATCH_SIZE: "5"
          BACKFILL_INDIVIDUAL_ATTEMPTS: "3"
          BACKFILL_SEGMENT_YEARS: "3"
          BACKFILL_RETRY_BASE_SECONDS: "1"
          BACKFILL_STAGE_PAUSE_SECONDS: "5"
          BACKFILL_MIN_BARS: "260"
          BACKFILL_MIN_COVERAGE_RATIO: "0.85"
          BACKFILL_MAX_GAP_DAYS: "21"
          BACKFILL_MAX_STALE_DAYS: "7"
          BACKFILL_ALLOWED_MISSING: ""
        run: python -m src.backfill_10y

      - name: Build point-in-time annual model dataset
        run: |
          rm -rf /tmp/r4_model_dataset
          python -m research.clean_sheet_predictive.build_research_dataset \
            --input backtest_data/ohlcv_10y.csv \
            --config backtest_data/rotation_universe_snapshot.csv \
            --output /tmp/r4_model_dataset \
            --analysis-years "$BACKFILL_YEARS"

      - name: Append frozen R4 model year
        run: |
          python -m research.clean_sheet_predictive.r4_model_builder \
            --dataset /tmp/r4_model_dataset/research_dataset.csv.gz \
            --model-year "$MODEL_YEAR" \
            --registry research/clean_sheet_predictive/r4_model_registry.json

      - name: Restore normal research config
        if: always()
        run: |
          if [ -f /tmp/rotation_universe_original.csv ]; then
            cp /tmp/rotation_universe_original.csv config/rotation_universe.csv
          fi

      - name: Upload annual model-refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-sheet-r4-model-refresh-${{ github.run_id }}
          path: |
            research/clean_sheet_predictive/r4_model_registry.json
            backtest_data/backfill_summary.json
            backtest_data/fetch_failures.csv
            backtest_data/ticker_quality.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit registry to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/clean_sheet_predictive/r4_model_registry.json
          if git diff --cached --quiet; then
            echo "R4 model registry already contains this exact model year."
          else
            git commit -m "Append R4 annual frozen model"
            git push origin HEAD:research/clean-sheet-predictive
          fi
